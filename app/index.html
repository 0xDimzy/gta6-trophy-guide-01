<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leonida Trophy Guide — GTA VI</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="site-header">
  <div class="brand">
    <h1>Leonida Trophy Guide</h1>
    <p class="sub">Grand Theft Auto VI · PlayStation 5 · 55 official trophies · offline tracker</p>
  </div>
  <div class="progress">
    <div class="progress-text" id="progressText">0 of 55 earned (0%)</div>
    <div class="progress-bar" id="progressBar"><div class="progress-fill"></div></div>
    <div class="grade-counts" id="gradeCounts"></div>
    <div class="plat-note" id="platNote"></div>
  </div>
</header>
<nav class="view-tabs">
  <button class="tab" data-view="checklist" id="tabChecklist">Checklist</button>
  <button class="tab" data-view="roadmap" id="tabRoadmap">Roadmap to platinum</button>
</nav>
<div class="controls">
  <label>Kind
    <select id="filterKind">
      <option value="all">All</option>
      <option value="story">Story</option>
      <option value="missable">Missable</option>
      <option value="collectibles">Collectibles</option>
      <option value="activities">Activities</option>
      <option value="online">Online</option>
    </select>
  </label>
  <label>Grade
    <select id="filterGrade">
      <option value="all">All</option>
      <option value="platinum">Platinum</option>
      <option value="gold">Gold</option>
      <option value="silver">Silver</option>
      <option value="bronze">Bronze</option>
    </select>
  </label>
  <label>Search <input id="searchBox" type="search" placeholder="Filter trophies…"></label>
  <label class="toggle"><input type="checkbox" id="hideEarned"> Hide earned</label>
  <label class="toggle"><input type="checkbox" id="spoilerMode"> Spoiler mode (hide unearned story details)</label>
  <div class="tracker">
    <button id="btnExport" type="button">Export progress</button>
    <label class="import">Import progress <input id="importFile" type="file" accept="application/json"></label>
  </div>
</div>
<section id="viewChecklist" class="view" aria-label="Checklist"></section>
<section id="viewRoadmap" class="view hidden" aria-label="Roadmap"></section>
<script type="module" src="app.js"></script>
</body>
</html>
